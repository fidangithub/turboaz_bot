name: Turbo.az Nissan Sunny Bildiriş

on:
  schedule:
    # Hər 10 dəqiqədən bir işə düşür (UTC vaxtı ilə).
    # GitHub-un pulsuz planında dəqiq 10 dəqiqə deyil, bəzən
    # bir neçə dəqiqə gecikə bilər — bu normaldır.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # "Run workflow" düyməsi ilə əl ilə də işə salına bilər

permissions:
  contents: write  # seen_ids.json faylını commit etmək üçün lazımdır

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Repo-nu çək
        uses: actions/checkout@v4

      - name: Python quraşdır
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Skripti işə sal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_turbo.py

      - name: Görülmüş elanları saxla (commit et)
        run: |
          git config user.name "turbo-bot"
          git config user.email "turbo-bot@users.noreply.github.com"
          git add seen_ids.json
          git diff --staged --quiet || git commit -m "seen_ids.json yeniləndi"
          git push
